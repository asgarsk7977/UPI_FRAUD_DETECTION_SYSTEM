{% extends "base.html" %}

{% block title %}Transaction - UPI Fraud Detection System{% endblock %}

{% block content %}
<h1>Transaction Entry</h1>

<form action="{{ url_for('transaction') }}" method="POST">
    <div class="form-group">
        <label for="date">Date:</label>
        <input type="date" id="date" name="date" required>
    </div>

    <div class="form-group">
        <label for="upi_id">UPI ID:</label>
        <input type="text" id="upi_id" name="upi_id" placeholder="Enter UPI ID" required>
    </div>

    <div class="form-group">
        <label for="transaction_id">Transaction ID:</label>
        <input type="text" id="transaction_id" name="transaction_id" placeholder="Enter Transaction ID" required>
    </div>

    <div class="form-group">
        <label for="mobile_number">Receiver Mobile Number:</label>
        <input type="text" id="mobile_number" name="mobile_number" placeholder="Enter Mobile Number" required>
    </div>

    <div class="form-group">
        <label for="amount">Amount (₹):</label>
        <input type="number" id="amount" name="amount" step="0.01" placeholder="Enter Amount" required>
    </div>

    <div class="form-group">
        <label for="risk_level">Risk Range:</label>
        <select id="risk_level" name="risk_level" required>
            <option value="">Select Risk Level</option>
            <option value="Low">Low</option>
            <option value="Medium">Medium</option>
            <option value="High">High</option>
        </select>
    </div>

    <button type="submit">Check Fraud</button>
</form>
{% endblock %}
